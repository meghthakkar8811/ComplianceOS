# Base Pekko configuration for the scheduler cluster's "local" tier. Self-contained (not a
# diff over ../default.conf) — deployae's pekko_actor_conf() resolves to exactly one file, most
# specific first, with no merging across levels, so whichever file wins must be the whole config.
#
# Identical to ../default.conf except pekko.cluster.min-nr-of-members, below: the local tier
# runs scheduler at a single replica (deploy/k8s/scheduler/tiers/local/values.yaml), with no HA
# expectation. A lone node can never satisfy min-nr-of-members = 2 — the leader would never move
# it from Joining to Up, and neither SchedulerActor (singleton) nor WorkerActor (which asks it for work)
# would ever start. Safe to relax to 1 here specifically because replicas is also 1 here; a tier
# running more replicas should use ../default.conf instead (or its own self-contained file), and
# staging/prod must keep at least 2 (ideally 3, for the split-brain resolver's keep-majority
# margin).

pekko {
  loglevel = INFO
  # Cap dead-letter noise in production; set higher during debugging.
  log-dead-letters                 = 10
  log-dead-letters-during-shutdown = off

  # ── Actor ──────────────────────────────────────────────────────────────────

  actor {
    provider = cluster

    # The default dispatcher is backed by OS platform threads (fork-join-executor)
    # rather than virtual threads. This is critical for cluster stability in Kubernetes.
    # Virtual threads in a constrained CPU environment (like a k8s pod with 0.5 CPUs)
    # are mapped to a single OS carrier thread. If an actor does heavy CPU work on a
    # virtual thread, it stalls all other virtual threads, which delays cluster gossip
    # and heartbeats, causing spurious split-brain node evictions. The OS thread pool
    # guarantees heartbeats get CPU time as all threads would get at least some CPU time
    default-dispatcher {
      type = Dispatcher
      executor = fork-join-executor
      fork-join-executor {
        parallelism-min = 8
        parallelism-factor = 1.0
        parallelism-max = 16
      }
      throughput = 50
    }


    # Platform-thread dispatcher for cluster gossip and failure-detector
    # heartbeats.  Virtual thread scheduling jitter can inflate phi values
    # and trigger spurious node-down decisions.
    heartbeat-dispatcher {
      type     = Dispatcher
      executor = fork-join-executor
      fork-join-executor {
        parallelism-min    = 2
        parallelism-factor = 1.0
        parallelism-max    = 4
      }
      throughput = 100
    }

    # Dedicated dispatcher for blocking JDBC persistence operations.
    # Keeps Slick's blocking thread pool separate from the actor pool so
    # a slow DB does not stall mailbox processing.
    persistence-dispatcher {
      type     = Dispatcher
      executor = thread-pool-executor
      thread-pool-executor {
        # Match maxConnections so there is exactly one thread per DB connection
        # and no thread competes for a connection it cannot get immediately.
        fixed-pool-size = 16
      }
      throughput = 1
    }

    # Safety: prevent accidental Java serialization across the wire.
    warn-about-java-serializer-usage = on
    allow-java-serialization          = off

    debug {
      receive   = off
      lifecycle = off
      unhandled = on
    }

    serialization-bindings {
      "com.agentengine.util.pekko.PekkoSerializable" = jackson-cbor
    }
  }
  serialization {
    jackson {
      # JavaTimeModule/Jdk8Module are already in pekko-serialization-jackson's own defaults;
      # only Guava's needs adding.
      jackson-modules += "com.fasterxml.jackson.datatype.guava.GuavaModule"
    }
  }

  # ── Persistence ────────────────────────────────────────────────────────────

  persistence {
    journal {
      plugin = "jdbc-journal"
    }
    snapshot-store {
      plugin = "jdbc-snapshot-store"
    }
  }

  # ── Remote (Artery TCP) ────────────────────────────────────────────────────

  remote {
    artery {
      # TCP is reliable and required for Kubernetes (no multicast; no raw UDP).
      transport = tcp

      bind {
        hostname = "0.0.0.0"
      }

      advanced {
        # Agent sessions carry large AI context windows.  4 MiB covers typical
        # LLM responses; messages above this threshold use the large-message
        # channel (up to maximum-large-payload-size) at the cost of extra buffering.
        maximum-frame-size         = 4 MiB
        maximum-large-payload-size = 16 MiB

        # Buffer sizes: larger pools reduce allocations under burst load but
        # consume heap.  These are per-connection pools.
        buffer-pool-size       = 128
        large-buffer-pool-size = 32
      }
    }
  }

  # ── Management & Discovery ──────────────────────────────────────────────────

  management {
    http {
      port = 8558
      bind-port = 8558
    }
    cluster.bootstrap {
      contact-point-discovery {
        discovery-method = kubernetes-api
        port-name = "pekko-mgmt"

        # Defaults to 2 upstream; scheduler-local runs a single replica, so
        # bootstrap must be able to seed itself as a one-node cluster (see
        # min-nr-of-members = 1 below).
        required-contact-point-nr = 1
      }
    }
  }

  # ── Cluster ────────────────────────────────────────────────────────────────

  cluster {
    # We use Cluster Bootstrap with the Kubernetes API for dynamic seed node discovery
    # seed-nodes are no longer statically populated.

    # Relaxed from the usual 2 (see ../default.conf) — see the file header above.
    min-nr-of-members = 1

    # Phi-accrual failure detector — tuned for Kubernetes where inter-pod
    # latency can spike during pod scheduling, GC pauses, and node pressure.
    failure-detector {
      heartbeat-message-transport = "pekko.actor.heartbeat-dispatcher"
      # Threshold 10 is tighter than our previous 12 but still tolerates typical
      # k8s GC pauses without false positives.
      threshold                   = 10.0
      # Allow up to 15 s of missed heartbeats (covers node-pressure scheduling
      # delays and rolling-restart grace windows).
      acceptable-heartbeat-pause  = 15s
      heartbeat-interval          = 2s
      min-std-deviation           = 500ms
      expected-response-after     = 3s
    }

    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"

    split-brain-resolver {
      # keep-majority: the larger partition continues; the minority self-downs.
      # Safe for 3+ nodes and avoids split-brain without manual intervention.
      active-strategy        = keep-majority
      # 30 s absorbs rolling-restart jitter (pods briefly unreachable) before
      # the SBR acts.  Too short causes unnecessary node evictions.
      stable-after           = 30s
      # If the cluster cannot reach a stable state after the decision window,
      # down everything — a controlled restart beats an uncertain partition.
      down-all-when-unstable = on
    }

    # k8s DNS for the headless service and Kube scheduler can add latency during
    # rolling restarts.  60 s gives pods enough time to resolve seed nodes and
    # re-join before the process exits.
    shutdown-after-unsuccessful-join-seed-nodes = 60s

    # ── Sharding ─────────────────────────────────────────────────────────────

    sharding {
      number-of-shards = 100

      coordinator-state {
        # 5 s rebalance interval avoids thrashing during rolling restarts where
        # multiple pods cycle quickly.  The default 2 s is too aggressive.
        rebalance-interval         = 5s
        max-simultaneous-rebalance = 5
      }

      shard-region-query-timeout = 5s

      # Retry shard handshake: useful when a new pod joins mid-rebalance and
      # the coordinator is momentarily unreachable.
      retry-interval = 2s
    }
  }

  # ── Coordinated shutdown ───────────────────────────────────────────────────

  coordinated-shutdown {
    # Ensure a clean cluster leave on JVM shutdown (SIGTERM from k8s).
    run-by-jvm-shutdown-hook = on
    terminate-actor-system   = on

    phases {
      cluster-sharding-shutdown-region {
        # Give in-flight agent sessions time to finish their current step and
        # flush their journal before the shard region closes.
        timeout = 60s
      }
      cluster-leave {
        # Allow gossip to propagate the departure so peers do not mark this
        # node unreachable before it closes TCP channels.
        timeout = 30s
      }
      actor-system-terminate {
        timeout = 15s
      }
    }
  }
}

# ── JDBC persistence ──────────────────────────────────────────────────────────

pekko-persistence-jdbc {
  shared-databases {
    slick {
      profile = "slick.jdbc.PostgresProfile$"
      db {
        connectionPool = "HikariCP"
        driver         = "org.postgresql.Driver"

        # numThreads == maxConnections: one Slick thread per connection so no
        # thread ever blocks waiting for a connection that another thread holds.
        numThreads     = 16
        maxConnections = 16
        minConnections = 4

        # Large queue to absorb write bursts from multi-step agent tool chains
        # without dropping work; pairs well with the persistence-dispatcher above.
        queueSize = 10000

        # HikariCP connection lifecycle tuning for a stable PostgreSQL backend.
        connectionTimeout    = 10000   # ms — fail fast if pool is exhausted
        validationTimeout    = 3000    # ms
        idleTimeout          = 600000  # 10 min — recycle idle connections
        maxLifetime          = 1800000 # 30 min — rotate to prevent stale TCP
        keepAliveConnection  = on
      }
    }
  }
}

# Route JDBC plugin work through the dedicated blocking dispatcher so slow
# database operations do not interfere with actor mailbox processing.
jdbc-journal {
  use-shared-db     = "slick"
  plugin-dispatcher = "pekko.actor.persistence-dispatcher"
}

jdbc-snapshot-store {
  use-shared-db     = "slick"
  plugin-dispatcher = "pekko.actor.persistence-dispatcher"
}

jdbc-read-journal {
  use-shared-db = "slick"
}
