[project]
name = "deploycos"
version = "0.1.0"
description = "Deployment CLI for the complianceos Helm charts"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "pyyaml>=6.0",
    "pymongo>=4.9",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "grpcio>=1.62",
    "grpcio-health-checking>=1.62",
]

[project.scripts]
deploycos = "deploycos.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deploycos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
