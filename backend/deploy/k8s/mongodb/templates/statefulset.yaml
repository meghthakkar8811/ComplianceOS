{{- $probes := include "complianceos.infra-base.probes" . | fromYaml -}}
{{- $instance := include "complianceos.infra-base.instance" . -}}
{{- $namespace := include "complianceos.infra-base.namespace" . -}}
{{- $replicaCount := int (.Values.replicaCount | default 1) -}}
{{- $replicaSetName := .Values.replicaSetName -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $instance }}
  namespace: {{ $namespace }}
  labels:
    {{- include "complianceos.infra-base.labels" . | nindent 4 }}
spec:
  serviceName: {{ $instance }}-headless
  replicas: {{ $replicaCount }}
  selector:
    matchLabels:
      {{- include "complianceos.infra-base.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "complianceos.infra-base.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "complianceos.infra-base.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if gt $replicaCount 1 }}
            - --replSet
            - {{ $replicaSetName | default "rs0" }}
            {{- end }}
            - --bind_ip_all
          securityContext:
            {{- include "complianceos.infra-base.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: mongo
              containerPort: 27017
          startupProbe:
            tcpSocket:
              port: mongo
            periodSeconds: {{ $probes.startup.periodSeconds }}
            failureThreshold: {{ $probes.startup.failureThreshold }}
            timeoutSeconds: {{ $probes.startup.timeoutSeconds }}
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: {{ $probes.readiness.periodSeconds }}
            failureThreshold: {{ $probes.readiness.failureThreshold }}
            timeoutSeconds: {{ $probes.readiness.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
              port: mongo
            periodSeconds: {{ $probes.liveness.periodSeconds }}
            failureThreshold: {{ $probes.liveness.failureThreshold }}
            timeoutSeconds: {{ $probes.liveness.timeoutSeconds }}
          resources:
            {{- toYaml (required "resources must be set" .Values.resources) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ required "persistence.size must be set" .Values.persistence.size }}
