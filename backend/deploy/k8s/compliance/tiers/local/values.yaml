app-base:
  tier: local
  minReadySeconds: 0
  preStopSleepSeconds: 0
  terminationGracePeriodSeconds: 10
  # No zero-downtime need locally — Recreate avoids the base default's surge pod, which
  # doubles CPU/memory demand during rollout on this resource-constrained node.
  deploymentStrategy:
    type: Recreate
  replicas: 1
  resources:
    requests:
      cpu: "200m"
      memory: "350Mi"
    limits:
      cpu: "200m"
      memory: "350Mi"
  config:
    applicationProperties:
      quarkus.otel.service.name: complianceos-compliance
      # Disabled: no OTel collector deployed. Remove and set quarkus.otel.exporter.otlp.endpoint when one is available.
      quarkus.otel.sdk.disabled: "true"
      quarkus.grpc.server.use-separate-server: "false"
      # terminationGracePeriodSeconds (base default: 90) must exceed preStopSleepSeconds + this value.
      quarkus.shutdown.timeout: 5S
