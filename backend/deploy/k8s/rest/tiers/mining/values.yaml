app-base:
  imagePullSecrets:
    - name: ocir-pull
  ingress:
    enabled: true
    className: nginx
    clusterIssuer: letsencrypt-prod
    tlsEnabled: true
    hosts:
      - host: agentengine.duckdns.org
        paths:
          - path: /
            pathType: Prefix
  tier: mining
  minReadySeconds: 0
  preStopSleepSeconds: 0
  terminationGracePeriodSeconds: 10
  deploymentStrategy:
    type: Recreate
  replicas: 1
  resources:
    requests:
      cpu: "200m"
      memory: "350Mi"
    limits:
      cpu: "200m"
      memory: "350Mi"
  config:
    applicationProperties:
      quarkus.otel.service.name: complianceos-rest
      quarkus.otel.sdk.disabled: "true"
      quarkus.grpc.server.use-separate-server: "false"
      quarkus.shutdown.timeout: 5S

      quarkus.http.cors.enabled: "true"
      quarkus.http.cors.origins: "http://localhost:3000,/https://.*\\.vercel\\.app/"
      quarkus.http.cors.methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
      quarkus.http.cors.headers: "accept,authorization,content-type,x-requested-with"
      quarkus.http.cors.exposed-headers: "Content-Disposition"
      quarkus.http.cors.access-control-max-age: "24H"
      quarkus.http.cors.access-control-allow-credentials: "true"
      # The console (vercel.app) and this API are different sites, so the session cookie must be
      # sent cross-site.
      agent-engine.auth.session-cookie-same-site: "NONE"
