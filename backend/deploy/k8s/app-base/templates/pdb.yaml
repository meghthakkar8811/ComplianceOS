{{- $pdb := .Values.pdb | default dict }}
{{- $enabled := required "pdb.enabled must be set" $pdb.enabled }}
{{- if and $enabled (gt (int (required "replicas must be set" .Values.replicas)) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "complianceos.app-base.instance" . }}
  namespace: {{ include "complianceos.app-base.namespace" . }}
  labels:
    {{- include "complianceos.app-base.labels" . | nindent 4 }}
spec:
  minAvailable: {{ required "pdb.minAvailable must be set" $pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "complianceos.app-base.selectorLabels" . | nindent 6 }}
{{- end }}
