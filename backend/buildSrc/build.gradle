plugins {
    id 'java'
    id 'java-gradle-plugin'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    implementation libs.spotless.gradle.plugin
    implementation libs.jandex.gradle.plugin
    implementation 'org.jetbrains.gradle.plugin.idea-ext:org.jetbrains.gradle.plugin.idea-ext.gradle.plugin:1.4.1'
    implementation group: 'io.quarkus', name: 'gradle-application-plugin', version: libs.versions.quarkus.get()
    implementation group: 'io.quarkus.extension', name: 'gradle-extension-plugin', version: libs.versions.quarkus.get()
    // functionaljava must be on the buildscript classpath so spotless's FeatureClassLoader
    // can resolve it when running palantir-java-format (declared 'runtime' scope in its POM,
    // so Spotless's dependency resolver does not pull it in automatically).
    implementation 'org.functionaljava:functionaljava:5.0'
    // Same issue as functionaljava above, for google-java-format instead of palantir-java-format:
    // it depends on guava at 'runtime' scope in its own POM, which Spotless's FeatureClassLoader
    // does not resolve automatically, so google-java-format fails with NoClassDefFoundError on
    // Guava classes unless guava is added here explicitly.
    implementation libs.guava
}

gradlePlugin {
    plugins {
        javaLibraryConventions {
            id = 'com.complianceos.java-library-conventions'
            implementationClass = 'com.complianceos.conventions.JavaLibraryConventionsPlugin'
        }
        repackagedJars {
            id = 'com.complianceos.repackaged-jars'
            implementationClass = 'com.complianceos.conventions.RepackagedJarsPlugin'
        }
        javaApplicationConventions {
            id = 'com.complianceos.java-application-conventions'
            implementationClass = 'com.complianceos.conventions.JavaApplicationConventionsPlugin'
        }
    }
}
