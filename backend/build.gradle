allprojects {
    group = project.parent != null ? "com.complianceos.${project.parent.name}" : 'com.complianceos'
    version = '1.0.0-SNAPSHOT'
}

subprojects {
    repositories {
        mavenCentral()
        mavenLocal()
        maven {
            // com.agentengine:* dependencies are published here, not under this repo's own
            // GitHub Packages registry.
            name = "AgentEngineGitHubPackages"
            url = uri("https://maven.pkg.github.com/hunter1703/agent-engine")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR") ?: "dummy_user"
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN") ?: "dummy_token"
            }
        }
    }
}
