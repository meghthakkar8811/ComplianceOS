# Quarkus Platform Config
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom

# Gradle Performance Optimizations
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

# Enable Gradle Daemon for faster builds
org.gradle.daemon=true
org.gradle.daemon.idletimeout=900000

# Enable parallel execution for faster multi-module builds
org.gradle.parallel=true

# Enable build cache
org.gradle.caching=true

# Enable file watching for incremental builds
org.gradle.vfs.watch=true

# Required with current toolchain: disabling this reproduces a configuration-time
# ConcurrentModificationException in Quarkus app model resolution.
disableQuarkusComponentVariants=true
