# Google AI
google-genai = { group = "com.google.genai", name = "google-genai", version.ref = "google-genai" }
google-adk = { group = "com.google.adk", name = "google-adk", version.ref = "google-adk" }
google-adk-langchain4j = { group = "com.google.adk", name = "google-adk-langchain4j", version.ref = "google-adk" }

# Quarkus & LangChain4j Core
langchain4j-core = { group = "dev.langchain4j", name = "langchain4j" }
langchain4j-open-ai = { group = "dev.langchain4j", name = "langchain4j-open-ai", version.ref = "langchain4j-plugin" }
langchain4j-ollama = { group = "dev.langchain4j", name = "langchain4j-ollama", version.ref = "langchain4j-plugin" }
langchain4j-qdrant = { group = "dev.langchain4j", name = "langchain4j-community-qdrant", version.ref = "langchain4j-plugin" }
langchain4j-http-client-jdk = { group = "dev.langchain4j", name = "langchain4j-http-client-jdk" }
langchain4j-poi = { group = "dev.langchain4j", name = "langchain4j-document-parser-apache-poi" }
pdfbox = { group = "org.apache.pdfbox", name = "pdfbox", version.ref = "pdfbox" }
qdrant-client = { group = "io.qdrant", name = "client", version.ref = "qdrant-client" }
quarkus-mongodb-client = { group = "io.quarkus", name = "quarkus-mongodb-client" }
quarkus-logging-json = { group = "io.quarkus", name = "quarkus-logging-json" }
quarkus-rest-jackson = { group = "io.quarkus", name = "quarkus-rest-jackson" }
quarkus-smallrye-openapi = { group = "io.quarkus", name = "quarkus-smallrye-openapi" }
quarkus-grpc = { group = "io.quarkus", name = "quarkus-grpc" }
quarkus-opentelemetry = { group = "io.quarkus", name = "quarkus-opentelemetry" }
quarkus-smallrye-fault-tolerance = { group = "io.quarkus", name = "quarkus-smallrye-fault-tolerance" }
opentelemetry-api = { group = "io.opentelemetry", name = "opentelemetry-api" }
quarkus-jackson = { group = "io.quarkus", name = "quarkus-jackson" }
quarkus-smallrye-health = { group = "io.quarkus", name = "quarkus-smallrye-health" }
quarkus-micrometer-registry-prometheus = { group = "io.quarkus", name = "quarkus-micrometer-registry-prometheus" }
quarkus-hibernate-validator = { group = "io.quarkus", name = "quarkus-hibernate-validator" }
quarkus-arc = { group = "io.quarkus", name = "quarkus-arc" }
quarkus-elytron-security-common = { group = "io.quarkus", name = "quarkus-elytron-security-common" }
quarkus-config-smallrye = { group = "io.quarkus", name = "quarkus-smallrye-context-propagation" }
quarkus-agroal = { group = "io.quarkus", name = "quarkus-agroal" }
quarkus-jdbc-postgresql = { group = "io.quarkus", name = "quarkus-jdbc-postgresql" }
quarkus-kubernetes-client = { group = "io.quarkus", name = "quarkus-kubernetes-client" }
quarkus-scheduler = { group = "io.quarkus", name = "quarkus-scheduler" }
fabric8-kubernetes-client = { group = "io.fabric8", name = "kubernetes-client", version.ref = "fabric8-kubernetes-client" }

# Jakarta APIs
jakarta-validation-api = { group = "jakarta.validation", name = "jakarta.validation-api", version.ref = "jakarta-validation" }
jakarta-inject-api = { group = "jakarta.inject", name = "jakarta.inject-api", version.ref = "jakarta-inject" }
jakarta-enterprise-cdi-api = { group = "jakarta.enterprise", name = "jakarta.enterprise.cdi-api", version.ref = "jakarta-cdi" }
jakarta-annotation-api = { group = "jakarta.annotation", name = "jakarta.annotation-api", version.ref = "jakarta-annotation" }
javax-annotation-api = { group = "javax.annotation", name = "javax.annotation-api", version.ref = "javax-annotation" }
microprofile-openapi-api = { group = "org.eclipse.microprofile.openapi", name = "microprofile-openapi-api", version.ref = "microprofile-openapi" }

# Logging
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
rxjava = { group = "io.reactivex.rxjava3", name = "rxjava", version.ref = "rxjava" }
reactive-streams = { group = "org.reactivestreams", name = "reactive-streams", version.ref = "reactive-streams" }
stateless4j = { group = "com.github.stateless4j", name = "stateless4j", version.ref = "stateless4j" }


# AWS SDK v2
aws-s3 = { group = "software.amazon.awssdk", name = "s3", version.ref = "aws-sdk" }
aws-sts = { group = "software.amazon.awssdk", name = "sts", version.ref = "aws-sdk" }

# OCI Java SDK
oci-objectstorage = { group = "com.oracle.oci.sdk", name = "oci-java-sdk-objectstorage", version.ref = "oci-sdk" }
oci-common = { group = "com.oracle.oci.sdk", name = "oci-java-sdk-common", version.ref = "oci-sdk" }
oci-common-httpclient-jersey3 = { group = "com.oracle.oci.sdk", name = "oci-java-sdk-common-httpclient-jersey3", version.ref = "oci-sdk" }
# Quarkus's BOM excludes commons-logging (it standardizes on JBoss Logging) without substituting
# an API-compatible shim, so Apache HttpClient 4.x (pulled in transitively by the OCI SDK's Jersey3
# HTTP transport via jersey-apache-connector) throws NoClassDefFoundError on first use unless this
# shim is present. Quarkus-BOM-managed, hence no version.ref.
commons-logging-jboss-logging = { group = "org.jboss.logging", name = "commons-logging-jboss-logging" }
oci-keymanagement = { group = "com.oracle.oci.sdk", name = "oci-java-sdk-keymanagement", version.ref = "oci-sdk" }
oci-core = { group = "com.oracle.oci.sdk", name = "oci-java-sdk-core", version.ref = "oci-sdk" }

# AG-UI
ag-ui-core = { group = "com.ag-ui.community", name = "java-core", version.ref = "ag-ui" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json-jvm", version.ref = "kotlinx-serialization" }

# Commons & Utilities
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { group = "com.fasterxml.jackson.dataformat", name = "jackson-dataformat-yaml", version.ref = "jackson" }
jackson-datatype-jdk8 = { group = "com.fasterxml.jackson.datatype", name = "jackson-datatype-jdk8", version.ref = "jackson" }
jackson-datatype-jsr310 = { group = "com.fasterxml.jackson.datatype", name = "jackson-datatype-jsr310", version.ref = "jackson" }
jackson-datatype-guava = { group = "com.fasterxml.jackson.datatype", name = "jackson-datatype-guava", version.ref = "jackson" }
jinjava = { group = "com.hubspot.jinjava", name = "jinjava", version.ref = "jinjava" }
java-diff-utils = { group = "io.github.java-diff-utils", name = "java-diff-utils", version.ref = "java-diff-utils" }
mongodb-bson = { group = "org.mongodb", name = "bson", version.ref = "mongodb" }
mongodb-driver-sync = { group = "org.mongodb", name = "mongodb-driver-sync", version.ref = "mongodb" }
vertx-json-schema = { group = "io.vertx", name = "vertx-json-schema", version.ref = "vertx" }
networknt-json-schema-validator = { group = "com.networknt", name = "json-schema-validator", version.ref = "networknt-json-schema-validator" }
json-path = { group = "com.jayway.jsonpath", name = "json-path", version.ref = "json-path" }
groovy = { group = "org.apache.groovy", name = "groovy", version.ref = "groovy" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
commons-text = { group = "org.apache.commons", name = "commons-text", version.ref = "commons-text" }
flexmark-all = { group = "com.vladsch.flexmark", name = "flexmark-all", version.ref = "flexmark" }
commonmark = { group = "org.commonmark", name = "commonmark", version.ref = "commonmark" }
jgroups = { group = "org.jgroups", name = "jgroups", version.ref = "jgroups" }
jgroups-kubernetes = { group = "org.jgroups.kubernetes", name = "jgroups-kubernetes", version.ref = "jgroups-kubernetes" }

# gRPC & Protobuf
protobuf-java = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "protobuf" }
protobuf-protoc = { group = "com.google.protobuf", name = "protoc", version.ref = "protobuf" }
grpc-protobuf = { group = "io.grpc", name = "grpc-protobuf", version.ref = "grpc" }
grpc-netty-shaded = { group = "io.grpc", name = "grpc-netty-shaded", version.ref = "grpc" }
grpc-stub = { group = "io.grpc", name = "grpc-stub", version.ref = "grpc" }
grpc-protoc-gen-java = { group = "io.grpc", name = "protoc-gen-grpc-java", version.ref = "grpc" }

# Build plugins
spotless-gradle-plugin = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version.ref = "spotless" }
jandex-gradle-plugin = { group = "org.kordamp.gradle", name = "jandex-gradle-plugin", version.ref = "jandex" }

[bundles]
# The OCI SDK's Jersey3 HTTP transport pulls in Apache HttpClient 4.x transitively, which needs
# the commons-logging shim (see commons-logging-jboss-logging above) — bundled so every module
# that uses this transport gets the shim automatically, without modules that don't touch OCI
# paying for it.
oci-httpclient-jersey3 = ["oci-common-httpclient-jersey3", "commons-logging-jboss-logging"]
