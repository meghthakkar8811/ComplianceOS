rxjava = "3.1.12"
reactive-streams = "1.0.4"
java-diff-utils = "4.16"
stateless4j = "2.6.0"
slf4j = "2.0.17"
commons-text = "1.13.1"
flexmark = "0.64.8"
commonmark = "0.28.0"

# Database & Drivers
mongodb = "5.6.3"
postgresql = "42.7.7"
